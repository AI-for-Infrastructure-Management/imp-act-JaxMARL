command:
  - ${env}
  - python
  - ${program}
  - --config-path=./config/hyper_parameter_tuning/cologne_v1
entity: imp-act
method: random
metric:
  goal: maximize
  name: test_returned_episode_returns
name: qmix_rnn_hyperparameter_tuning_cologne
parameters:
  # --- General Hyperparameters ---
  NUM_UPDATES:
    value: 6000
  NUM_ENVS:
    value: 32
  NUM_STEPS:
    value: 51
  BUFFER_SIZE:
    value: 5000
  BUFFER_BATCH_SIZE:
    value: 16
  HIDDEN_SIZE:
    value: 512
  MAX_GRAD_NORM:
    value: 12.5
  TARGET_UPDATE_INTERVAL:
    value: 32
  TAU:
    value: 1
  NUM_EPOCHS:
    value: 8
  LR:
    values: [0.0002, 0.0001, 0.00005]
  LEARNING_STARTS:
    value: 512
  LR_LINEAR_DECAY:
    value: False
  GAMMA:
    value: 0.99

  # --- Exploration ---
  EPS_START:
    value: 1
  EPS_FINISH:
    value: 0
  EPS_DECAY:
    value: 0.2

  # --- Mixer Specific ---
  MIXER_EMBEDDING_DIM:
    value: 64
  MIXER_HYPERNET_HIDDEN_DIM:
    value: 128
  MIXER_INIT_SCALE:
    value: 0.001

  # --- Environment/Reward ---
  REW_SCALE:
    value: 1.0e-8

  # --- Environment Configuration ---
  ENV_KWARGS:
      values:
      - encoding_type: binary
        include_extra_observations:
          segment_lengths: true
          volumes: true
          capacity: false
        map_name: CologneBonnDusseldorf-v1
      - encoding_type: none
        include_extra_observations:
          segment_lengths: true
          volumes: true
          capacity: false
        map_name: CologneBonnDusseldorf-v1

program: getting-started/qmix_rnn_road_env.py
project: jaxMARL-CologneBonnDusseldorf-v1