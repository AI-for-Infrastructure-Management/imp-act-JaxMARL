# Final-run config for VDN on the IMP-act road env.
# Hyperparameters: best combo C0011 from the 50-combo Cologne-v1 sweep
# (see evaluation/hyperparameter_tuning_analysis.ipynb).

"TOTAL_TIMESTEPS": 20_000_000
"NUM_ENVS": 32
"NUM_STEPS": 51
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 512
"EPS_START": 1.0
"EPS_FINISH": 0.0
"EPS_DECAY": 0.2 # percentage of updates
"MAX_GRAD_NORM": 10
"TARGET_UPDATE_INTERVAL": 10
"TAU": 1.0
"NUM_EPOCHS": 8
"LR": 1.0e-4
"LEARNING_STARTS": 10_000 # timesteps
"LR_LINEAR_DECAY": False
"GAMMA": 0.99

# ENV
"ENV_NAME": "road_env"
"ENV_KWARGS":
  "map_name": "Cologne-v1"
  "encoding_type": "none"     # can be binary, one-hot, sinusoidal or none
  "include_extra_observations":
    "segment_lengths": True     # Length of the segments
    "volumes": True             # Volumes of the vehicles on the segment normalized by the segment capacity
    "capacity": False           # Capacity of the segments

"REW_SCALE": 1e-9

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.01 # as a fraction of updates
"TEST_NUM_STEPS": 50 # must be a multiple of the episode horizon (50)
"TEST_NUM_ENVS": 10_000 # final runs use 10k-episode evals
"STORE_EVAL_RETURNS": True # dump raw per-episode eval returns to checkpoints/<seed>/eval_returns_<update>.csv.

"ALG_NAME": "vdn_rnn"

############ global params ############

# experiment params
"NUM_SEEDS": 1 # number of vmapped seeds
"SEED": "random"

"HYP_TUNE": False # perform hyp tune

# wandb params
"ENTITY": "imp-act"
"PROJECT": "imp-act-jaxMARL-final-runs"
"WANDB_MODE": "online"
"WANDB_LOG_ALL_SEEDS": False # will log separately the vmapped seeds

# checkpointing
"SAVE_CHECKPOINTS": True # save checkpoints
"SAVE_CHECKPOINTS_INTERVAL": 0.01 # as a fraction of updates. Tip: set to same value or fraction of TEST_INTERVAL.

# precision
"DOUBLE_PRECISION_MODE": False # use double precision for the environment

# hydra params
hydra:
  run:
    dir: outputs/${ENV_KWARGS.map_name}/${ALG_NAME}/${now:%Y-%m-%d_%H-%M-%S.%f}
