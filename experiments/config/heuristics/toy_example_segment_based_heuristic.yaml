map: ToyExample-v2
num_episodes: 1
num_steps: 50
norm_constant: 1.0
plot_histogram: false
double_precision_mode: false

# Policy parameters used inside get_budget_prioritized_policy
policy_parameters:
  inspection_interval: 1
  repair_threshold: 1
  prioritization_enabled: true

optimization:
  chunk_size: 2
  parameters:
    # Use "jittable: false" to keep even numeric-looking lists/ranges outside the jit sweep.
    inspection_interval:
      range:
        from: 1
        to: 2  
        step: 1
    repair_threshold:
      range:
        from: 1
        to: 1
        step: 1
    prioritization_key:
      list: ["volumes", "segment_lengths", "cost"]
    prioritization_sign:
      list: ["negative", "positive"]
    top_k:
      list: [0, 12]
      jittable: true

# hydra params
hydra:
  run:
    dir: outputs/${map}/segment_based_heuristic/${now:%Y-%m-%d_%H-%M-%S.%f}