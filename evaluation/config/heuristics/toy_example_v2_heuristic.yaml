map: ToyExample-v2  # Options: ToyExample-v2, Cologne-v1, CologneBonnDusseldorf-v1
policy: humble_heuristic  # Options: do_nothing, random, humble_heuristic
policy_params:
  inspection_interval: 5  # Every n timesteps the policy will perform inspection (action 1)
  repair_threshold: 1     # When observation exceeds this value, repair action is taken (action 2)
  prioritization_enabled: True
  prioritization_params: 
    prioritization_key: "volumes" # Options: "segment_lengths", "costs", "volumes"
    prioritization_sign: "positive"
num_episodes: 10000
num_steps: 50
norm_constant: 1e6
plot_histogram: False
double_precision_mode: False