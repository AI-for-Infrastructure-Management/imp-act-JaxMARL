map: Cologne-v1-critical-budget
policy: segment_based_heuristic
num_envs: 10000
num_steps: 50
norm_constant: 1e6
plot_histogram: False
double_precision_mode: False
policy_parameters:
  inspection_interval: 46
  repair_threshold: 2
  prioritization_enabled: True
  prioritization_key: "segment_lengths"
  prioritization_sign: "negative"
  top_k: 50

# hydra params
hydra:
  run:
    dir: outputs/${map}/segment_based_heuristic/eval/${now:%Y-%m-%d_%H-%M-%S.%f}
